name: calculator

services:
  calculator:
    build: .
    image: ${IMAGE_NAME:-calculator}:${IMAGE_TAG:-latest}
    environment:
      - SERVER_PORT=8081
      - JAVA_TOOL_OPTIONS=-Xmx256m
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - calc-net

  nginx:
    build: ./nginx
    image: calculator-nginx:latest
    ports:
      - "80:80"
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
