name: jenkins

services:
  jenkins:
    build: .
    image: calculator-jenkins:latest
    ports:
      - "8082:8080"
    env_file:
      - ../.env
    # group that owns docker.sock (0 on docker desktop, the docker group id on linux)
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: http --url=${NGROK_DOMAIN} jenkins:8080
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - jenkins
    restart: unless-stopped

volumes:
  jenkins_home:
